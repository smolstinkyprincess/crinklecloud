# RazrGuard runit service definitions. Re-run install-services.sh after editing.
#
# Format:  name  where  command...
#   where = host          run directly in Termux
#           proot         run inside the Debian proot as root
#           proot:USER    run inside the Debian proot as USER
#
# Commands must stay in the FOREGROUND (no daemonize flags) or runit will see them exit
# and restart them in a loop. sshd is not listed: the openssh package ships its own
# runit service, the installer just enables it.
#
# Proot commands must END by exec-ing their service in the foreground (e.g. `exec
# jellyfin ...`), not by backgrounding it with nohup/& or `caddy start` and exiting.
# start-vault.sh/stop-vault.sh are replaced by the vaultwarden + caddy services below.

darkhttpd     host           darkhttpd /data/data/com.termux/files/home/dashboard --addr 0.0.0.0 --port 8000
filebrowser   host           filebrowser -d /data/data/com.termux/files/home/.config/filebrowser/filebrowser.db
transmission  host           transmission-daemon --foreground
update-stats  host           bash /data/data/com.termux/files/home/update-stats.sh
trans-helper  host           python3 -u /data/data/com.termux/files/home/trans-helper.py
razrguard-monitor host       bash /data/data/com.termux/files/home/.termux/razrguard-monitor.sh

jellyfin      proot          env DOTNET_GCHeapHardLimit=0x20000000 /usr/local/bin/start-jellyfin.sh
suwayomi      proot          env JAVA_TOOL_OPTIONS="-Xmx512m -XX:+UseG1GC" /usr/local/bin/start-suwayomi.sh
vaultwarden   proot          /bin/sh -c 'cd /root/vaultwarden && set -a && { [ ! -f .env ] || . ./.env; } && set +a && exec ./vaultwarden'
caddy         proot          caddy run --config /etc/caddy/Caddyfile
